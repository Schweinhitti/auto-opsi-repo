server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    charset utf-8;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
