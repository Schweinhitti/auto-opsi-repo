services:
  repo-builder:
    build:
      context: .
      dockerfile: builder/Dockerfile
      args:
        OPSI_BASE_IMAGE: ${OPSI_BASE_IMAGE:-uibmz/opsi-server:4.3}
    user: "${BUILDER_UID:-1000}:${BUILDER_GID:-1000}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      UPDATE_INTERVAL_SECONDS: ${UPDATE_INTERVAL_SECONDS:-21600}
      KEEP_VERSIONS: ${KEEP_VERSIONS:-2}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-2147483648}
      ALLOW_CHANGED_CHECKSUM: ${ALLOW_CHANGED_CHECKSUM:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REPO_ROOT: /data
      CATALOG_PATH: /app/catalog/packages.yaml
    volumes:
      - ./catalog:/app/catalog:ro
      - ./repository:/data/repository
      - ./state:/data/state
      - ./work:/data/work
    tmpfs:
      - /tmp:mode=1777
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  repo-web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8088}:80"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./repository:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
