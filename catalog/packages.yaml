- id: python
  opsi_product_id: auto-python
  name: Python 3.14
  description: Python 3.14 for Windows x64
  enabled: true
  source:
    type: winget_manifest
    package_identifier: Python.Python.3.14
    allowed_hosts:
    - www.python.org
    installer_types:
    - burn
    - exe
    track: '3.14'
  architecture:
  - x64
  installer:
    type: exe
    silent_args:
    - /quiet
    - InstallAllUsers=1
    - PrependPath=1
    - Include_test=0
  detection:
    method: registry
    display_name_regex: ^Python 3\.14\.\d+ \(64-bit\)$
    version_from_display_name_regex: ^Python (\d+\.\d+\.\d+)
  uninstall:
    method: registry
    silent_args:
    - /uninstall
    - /quiet
  redistribution: internal_only
  package_revision: 2
