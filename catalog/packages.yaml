- id: git
  opsi_product_id: auto-git
  name: Git for Windows
  description: Git for Windows for Windows x64
  enabled: true
  source:
    type: github_release
    repo: git-for-windows/git
    release_type: latest
    prerelease: false
    asset_regex: Git-.*-64-bit\.exe
    allowed_hosts:
    - github.com
    - release-assets.githubusercontent.com
    - objects.githubusercontent.com
    version_regex: v(\d+(?:\.\d+)+\.windows\.\d+)
  architecture:
  - x64
  installer:
    type: exe
    silent_args:
    - /VERYSILENT
    - /NORESTART
    - /SUPPRESSMSGBOXES
  detection:
    method: registry
    display_name_regex: '^Git(?: version.*)?$'
    version_replacements:
      .windows.: .
  uninstall:
    method: registry
    silent_args:
    - /VERYSILENT
    - /NORESTART
  redistribution: internal_only
  package_revision: 2
