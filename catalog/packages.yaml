  package_revision: 1
- id: vlc
  opsi_product_id: auto-vlc
  name: VLC
  description: VLC for Windows x64
  enabled: false
  source:
    type: videolan
    version_url: https://download.videolan.org/pub/videolan/vlc/
    version_regex: href="(\d+\.\d+\.\d+)/"
    download_url_template: https://download.videolan.org/pub/videolan/vlc/{version}/win64/vlc-{version}-win64.exe
    allowed_hosts:
    - download.videolan.org
    checksum_url_template: https://download.videolan.org/pub/videolan/vlc/{version}/win64/vlc-{version}-win64.exe.sha256
  architecture:
  - x64
  installer:
    type: exe
    silent_args: &id002
    - /S
  detection:
    method: registry
    display_name_regex: ^VLC media player
  uninstall:
    method: registry
    silent_args: *id002
  redistribution: internal_only
  package_revision: 1
  disabled_reason: Live official download redirects to externally operated mirrors.
    Disabled under the vendor-owned-host policy; metadata/installer recipe is retained.
    Administrator must review official mirror distribution policy before enabling.
