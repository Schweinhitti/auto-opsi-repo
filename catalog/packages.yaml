packages:
- id: firefox
  opsi_product_id: auto-firefox
  name: Mozilla Firefox
  description: Mozilla Firefox for Windows x64
  enabled: true
  source:
    type: mozilla
    product: firefox
    channel: release
    version_url: https://product-details.mozilla.org/1.0/firefox_versions.json
    version_field: LATEST_FIREFOX_VERSION
    download_url_template: https://archive.mozilla.org/pub/firefox/releases/{version}/win64/en-US/Firefox%20Setup%20{version}.exe
    allowed_hosts:
    - product-details.mozilla.org
    - archive.mozilla.org
    checksum_url_template: https://archive.mozilla.org/pub/firefox/releases/{version}/SHA256SUMS
    checksum_filename_template: win64/en-US/Firefox Setup {version}.exe
  architecture:
  - x64
  installer:
    type: exe
    silent_args:
    - -ms
  detection:
    method: registry
    display_name_regex: ^Mozilla Firefox
  uninstall:
    method: registry
    silent_args:
    - /S
  redistribution: internal_only
  package_revision: 1
