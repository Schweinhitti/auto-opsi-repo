  name: Eclipse Temurin JDK 21
  description: Eclipse Temurin JDK 21 for Windows x64
  enabled: true
  source:
    type: adoptium
    java_version: 21
    api_url: https://api.adoptium.net/v3/assets/latest/{java_version}/hotspot?architecture=x64&image_type=jdk&os=windows&vendor=eclipse
    version_field: 0.version.semver
    url_field: 0.binary.installer.link
    sha256_field: 0.binary.installer.checksum
    allowed_hosts:
    - api.adoptium.net
    - github.com
    - release-assets.githubusercontent.com
    - objects.githubusercontent.com
    detection_version_field: 0.version.openjdk_version
  architecture:
  - x64
  installer:
    type: msi
    silent_args: &id008
    - /qn
    - /norestart
  detection:
    method: registry
    display_name_regex: ^Eclipse Temurin JDK with Hotspot 21
    version_regex: ^(\d+(?:\.\d+)+)
  uninstall:
    method: registry
    silent_args: *id008
  redistribution: internal_only
  package_revision: 2
