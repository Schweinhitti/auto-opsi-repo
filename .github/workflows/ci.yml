name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: builder/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r builder/requirements.txt pytest ruff
      - name: Compile Python sources
        run: python -m compileall -q builder scripts tests
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate shell syntax
        run: bash -n add-package.sh builder/entrypoint.sh helper/build.sh helper/cleanup.sh helper/dry-run.sh helper/logs.sh helper/run.sh helper/status.sh helper/test.sh
