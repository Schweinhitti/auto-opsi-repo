name: Bug report
description: Report a reproducible problem with the builder, repository, or package behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Don't report vulnerabilities or include secrets here. Use private vulnerability reporting for security findings.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest reliable sequence that reproduces the problem.
      placeholder: Include commands and the affected product ID when relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, host OS and architecture, Docker and Compose versions, and relevant OPSI or Windows versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and evidence
      description: Paste relevant output after removing tokens, credentials, private hostnames, and personal data.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues, read the troubleshooting guide, and removed secrets and private data from this report.
          required: true
